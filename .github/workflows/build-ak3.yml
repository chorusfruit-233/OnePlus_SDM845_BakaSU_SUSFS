name: Build OnePlus 6/6T Lineage 4.9 AK3

on:
  workflow_dispatch:
    inputs:
      resukisu_ref:
        description: ReSukiSU branch, tag, or commit
        required: false
        default: main
        type: string
      bbg_ref:
        description: Baseband Guard branch, tag, or commit
        required: false
        default: main
        type: string
      kernel_patches_ref:
        description: WildKernels patches branch, tag, or commit
        required: false
        default: main
        type: string
      anykernel_ref:
        description: AnyKernel3 branch, tag, or commit
        required: false
        default: master
        type: string
      rtl8812au_ref:
        description: rtl8812au driver branch, tag, or commit
        required: false
        default: v5.6.4.2
        type: string
      force_rebuild:
        description: Ignore the unchanged-input cache and rebuild
        required: false
        default: false
        type: boolean
      create_release:
        description: Create a GitHub Release with the AK3 zip and checksums
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag (auto-generated as v1.0.0-<timestamp> if empty)
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

concurrency:
  group: oneplus-sdm845-ak3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-inputs:
    runs-on: ubuntu-24.04
    outputs:
      build_key: ${{ steps.meta.outputs.build_key }}
      skip: ${{ steps.decide.outputs.skip }}
      marker_hit: ${{ steps.marker.outputs.cache-hit }}
      resukisu_sha: ${{ steps.meta.outputs.resukisu_sha }}
      cake_sha: ${{ steps.meta.outputs.cake_sha }}
      bbg_sha: ${{ steps.meta.outputs.bbg_sha }}
      kernel_patches_sha: ${{ steps.meta.outputs.kernel_patches_sha }}
      rtl8812au_sha: ${{ steps.meta.outputs.rtl8812au_sha }}
      anykernel_sha: ${{ steps.meta.outputs.anykernel_sha }}
    env:
      CONFIG: configs/enchilada.json
      RESUKISU_REF: ${{ inputs.resukisu_ref || 'main' }}
      BBG_REF: ${{ inputs.bbg_ref || 'main' }}
      KERNEL_PATCHES_REF: ${{ inputs.kernel_patches_ref || 'main' }}
      RTL8812AU_REF: ${{ inputs.rtl8812au_ref || 'v5.6.4.2' }}
      ANYKERNEL_REF: ${{ inputs.anykernel_ref || 'master' }}
    steps:
      - name: Checkout builder metadata
        uses: actions/checkout@v5

      - name: Resolve upstream commits
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local repo=$1 ref=$2 sha
            if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf '%s\n' "$ref"
              return
            fi
            sha=$(git ls-remote "$repo" \
              "refs/heads/$ref" "refs/tags/$ref" "refs/tags/$ref^{}" |
              awk '$2 ~ /\^\{\}$/ { print $1; found=1; exit } \
                   $2 ~ /refs\/(heads|tags)\// && !found { print $1; exit }')
            [[ -n "$sha" ]] || {
              echo "::error::Unable to resolve $repo ref $ref"
              exit 1
            }
            printf '%s\n' "$sha"
          }

          kernel_base=$(jq -r .kernel_base "$CONFIG")
          resukisu_sha=$(resolve_ref "$(jq -r .resukisu_repo "$CONFIG")" "$RESUKISU_REF")
          cake_sha=$(resolve_ref "$(jq -r .cake_repo "$CONFIG")" "$(jq -r .cake_ref "$CONFIG")")
          bbg_sha=$(resolve_ref "$(jq -r .bbg_repo "$CONFIG")" "$BBG_REF")
          kernel_patches_sha=$(resolve_ref "$(jq -r .kernel_patches_repo "$CONFIG")" "$KERNEL_PATCHES_REF")
          rtl8812au_sha=$(resolve_ref "$(jq -r .rtl8812au_repo "$CONFIG")" "$RTL8812AU_REF")
          anykernel_sha=$(resolve_ref "$(jq -r .anykernel_repo "$CONFIG")" "$ANYKERNEL_REF")
          builder_sha=$(git rev-parse HEAD)
          patch_sha=$(sha256sum patches/lineage-4.9/*.patch | sha256sum | cut -d' ' -f1)
          build_key="${kernel_base}-${resukisu_sha}-${cake_sha}-${bbg_sha}-${kernel_patches_sha}-${rtl8812au_sha}-${anykernel_sha}-${builder_sha}-${patch_sha}"

          {
            echo "resukisu_sha=$resukisu_sha"
            echo "cake_sha=$cake_sha"
            echo "bbg_sha=$bbg_sha"
            echo "kernel_patches_sha=$kernel_patches_sha"
            echo "rtl8812au_sha=$rtl8812au_sha"
            echo "anykernel_sha=$anykernel_sha"
            echo "build_key=$build_key"
          } >> "$GITHUB_OUTPUT"

      - name: Check unchanged-input marker
        id: marker
        uses: actions/cache/restore@v5
        with:
          path: .build-marker
          key: built-v1-${{ steps.meta.outputs.build_key }}
          lookup-only: true

      - name: Decide whether to build
        id: decide
        env:
          CACHE_HIT: ${{ steps.marker.outputs.cache-hit }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        shell: bash
        run: |
          if [[ "$CACHE_HIT" == "true" && "$FORCE_REBUILD" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Inputs unchanged; skipping kernel build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Build required (cache_hit=$CACHE_HIT force_rebuild=$FORCE_REBUILD)."
          fi

  build:
    needs: resolve-inputs
    if: needs.resolve-inputs.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONFIG: configs/enchilada.json
      RESUKISU_REF: ${{ needs.resolve-inputs.outputs.resukisu_sha }}
      CAKE_REF: ${{ needs.resolve-inputs.outputs.cake_sha }}
      BBG_REF: ${{ needs.resolve-inputs.outputs.bbg_sha }}
      KERNEL_PATCHES_REF: ${{ needs.resolve-inputs.outputs.kernel_patches_sha }}
      RTL8812AU_REF: ${{ needs.resolve-inputs.outputs.rtl8812au_sha }}
      ANYKERNEL_REF: ${{ needs.resolve-inputs.outputs.anykernel_sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Read configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          jq -e . "$CONFIG" >/dev/null
          for key in kernel_repo kernel_ref kernel_base defconfig arch cross_compile \
                     resukisu_repo cake_repo bbg_repo \
                     kernel_patches_repo rtl8812au_repo anykernel_repo; do
            echo "$key=$(jq -r .$key "$CONFIG")" >> "$GITHUB_OUTPUT"
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross ccache git libelf-dev libssl-dev python3 \
            rsync unzip zip

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ needs.resolve-inputs.outputs.build_key }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Clone pinned kernel base
        run: |
          git clone --filter=blob:none --no-checkout \
            '${{ steps.config.outputs.kernel_repo }}' kernel
          git -C kernel fetch --depth=1 origin \
            '${{ steps.config.outputs.kernel_base }}'
          git -C kernel checkout --detach \
            '${{ steps.config.outputs.kernel_base }}'
          test "$(git -C kernel rev-parse HEAD)" = \
            '${{ steps.config.outputs.kernel_base }}'

      - name: Apply 4.9 adaptation and fetch latest upstreams
        run: |
          set -euo pipefail
          git -C kernel apply --whitespace=nowarn \
            "$GITHUB_WORKSPACE/patches/lineage-4.9/kernel-4.9-adaptation.patch"
          scripts/prepare-sources.sh kernel \
            '${{ steps.config.outputs.resukisu_repo }}' "$RESUKISU_REF" \
            "$GITHUB_WORKSPACE/patches/lineage-4.9" \
            '${{ steps.config.outputs.cake_repo }}' "$CAKE_REF" "$RUNNER_TEMP/sch_cake" \
            '${{ steps.config.outputs.bbg_repo }}' "$BBG_REF" \
            '${{ steps.config.outputs.kernel_patches_repo }}' "$KERNEL_PATCHES_REF" \
            "$RUNNER_TEMP/kernel_patches" \
            '${{ steps.config.outputs.rtl8812au_repo }}' "$RTL8812AU_REF" \
            "$RUNNER_TEMP/rtl8812au"

      - name: Fetch latest AnyKernel3
        run: |
          git clone --filter=blob:none --no-checkout \
            '${{ steps.config.outputs.anykernel_repo }}' anykernel3
          git -C anykernel3 fetch --depth=1 origin "$ANYKERNEL_REF"
          git -C anykernel3 checkout --detach FETCH_HEAD

      - name: Configure kernel
        working-directory: kernel
        run: |
          make O=out ARCH='${{ steps.config.outputs.arch }}' \
            '${{ steps.config.outputs.defconfig }}'
          make O=out ARCH='${{ steps.config.outputs.arch }}' olddefconfig
          grep -E '^CONFIG_KSU(|_SUSFS.*)=y$' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' out/.config
          grep -qx 'CONFIG_NOMOUNT=y' out/.config
          grep -qx 'CONFIG_MAC80211=y' out/.config
          grep -qx 'CONFIG_ATH9K_HTC=y' out/.config
          grep -qx 'CONFIG_RT2800USB=y' out/.config
          grep -qx 'CONFIG_MT7601U=y' out/.config
          grep -q '^CONFIG_EXTRA_FIRMWARE="htc_9271.fw rt2870.bin mt7601u.bin"$' out/.config
          # KPatch-Next / KPM requirement (kernel image static patching)
          grep -qx 'CONFIG_KALLSYMS=y' out/.config
          grep -qx 'CONFIG_KALLSYMS_ALL=y' out/.config
          # ReKernel-X
          grep -qx 'CONFIG_REKERNEL=y' out/.config
          grep -qx 'CONFIG_REKERNEL_NETWORK=y' out/.config
          # zram compression backends and their built-in dependencies
          for option in CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_SWAP \
            CONFIG_CRYPTO_LZ4 CONFIG_LZ4_COMPRESS CONFIG_LZ4_DECOMPRESS \
            CONFIG_CRYPTO_ZSTD CONFIG_ZSTD_COMPRESS CONFIG_ZSTD_DECOMPRESS; do
            grep -qx "${option}=y" out/.config
          done
          # PSI is active by default, without requiring psi=1 at boot
          grep -qx 'CONFIG_PSI=y' out/.config
          grep -qx '# CONFIG_PSI_DEFAULT_DISABLED is not set' out/.config
          # rtl8812au/8821au/8814au out-of-tree USB Wi-Fi
          grep -qx 'CONFIG_88XXAU=y' out/.config
          required=(
            CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_NAMESPACES CONFIG_UTS_NS
            CONFIG_IPC_NS CONFIG_PID_NS CONFIG_USER_NS CONFIG_NET_NS
            CONFIG_SECCOMP CONFIG_SECCOMP_FILTER CONFIG_CGROUPS
            CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS CONFIG_MEMCG
            CONFIG_CGROUP_SCHED CONFIG_CGROUP_FREEZER CONFIG_CGROUP_NET_PRIO
            CONFIG_DEVTMPFS CONFIG_OVERLAY_FS CONFIG_TMPFS_POSIX_ACL
            CONFIG_TMPFS_XATTR CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER
            CONFIG_NETFILTER CONFIG_NF_CONNTRACK CONFIG_NF_TABLES
            CONFIG_IP_NF_TARGET_MASQUERADE CONFIG_IP_ADVANCED_ROUTER
            CONFIG_IP_MULTIPLE_TABLES
            CONFIG_NET_SCH_CAKE CONFIG_TCP_CONG_BBR3 CONFIG_BBG
          )
          for option in "${required[@]}"; do
            grep -qx "${option}=y" out/.config || {
              echo "::error::Missing Droidspaces requirement: ${option}=y"
              exit 1
            }
          done
          grep -qx '# CONFIG_ANDROID_PARANOID_NETWORK is not set' out/.config

      - name: Build Image.gz-dtb
        working-directory: kernel
        run: |
          make O=out ARCH='${{ steps.config.outputs.arch }}' \
            CROSS_COMPILE="ccache ${{ steps.config.outputs.cross_compile }}" \
            KCFLAGS=-Wno-error -j"$(nproc)" Image.gz-dtb
          ccache --show-stats

      - name: Build device syscall regression test
        run: |
          set -euo pipefail
          mkdir -p artifacts/device-tests
          aarch64-linux-gnu-gcc -static -O2 -Wall -Wextra \
            -o artifacts/device-tests/susfs_syscall_test \
            tests/device/susfs_syscall_test.c
          cp tests/device/run-susfs-regression.sh tests/device/README.md \
            artifacts/device-tests/
          chmod 0755 artifacts/device-tests/run-susfs-regression.sh

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          mkdir -p artifacts
          resukisu_sha=$(git -C kernel/KernelSU rev-parse --short=8 HEAD)
          susfs_sha=$(sha256sum patches/lineage-4.9/susfs-4.9.patch | cut -c1-8)
          package="OnePlus6-6T-ReSukiSU-${resukisu_sha}-SUSFS-${susfs_sha}-AK3.zip"
          scripts/package-ak3.sh anykernel3 \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            ak3/anykernel.sh "artifacts/$package"
          (cd artifacts && sha256sum "$package" > SHA256SUMS)
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifacts/
          {
            echo "kernel=$(git -C kernel rev-parse HEAD)"
            echo "resukisu=$(git -C kernel/KernelSU rev-parse HEAD)"
            echo "susfs=v2.3.0-vendored ($(sha256sum patches/lineage-4.9/susfs-4.9.patch | cut -c1-12))"
            echo "nomount=dev@$(jq -r .nomount.commit configs/vendored-upstreams.json) ($(sha256sum patches/lineage-4.9/nomount-4.9.patch | cut -c1-12))"
            echo "susfs_upstream=$(jq -r .susfs.commit configs/vendored-upstreams.json)"
            echo "susfs_port=$(jq -r .susfs.port_commit configs/vendored-upstreams.json)"
            echo "cake=$(git -C "$RUNNER_TEMP/sch_cake" rev-parse HEAD)"
            echo "baseband_guard=$(git -C kernel/Baseband-guard rev-parse HEAD)"
            echo "kernel_patches=$(git -C "$RUNNER_TEMP/kernel_patches" rev-parse HEAD)"
            echo "rtl8812au=$(git -C "$RUNNER_TEMP/rtl8812au" rev-parse HEAD)"
            echo "anykernel3=$(git -C anykernel3 rev-parse HEAD)"
          } > artifacts/build-info.txt

      - name: Upload AK3 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OnePlus6-6T-lineage-4.9-ak3
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="v1.0.0-$(date +%Y%m%d-%H%M%S)"
          fi

          notes="## 构建信息

          $(awk -F= '{printf "- **%s**: \`%s\`\n", $1, $2}' artifacts/build-info.txt)

          ## 使用

          1. 解压 action artifact 后，核对 \`SHA256SUMS\` 再刷入 \`*-AK3.zip\`；
          2. 本 release 的资产即 artifact 内对应文件，校验值见 \`SHA256SUMS\`。"

          gh release create "$tag" \
            artifacts/*-AK3.zip artifacts/SHA256SUMS \
            artifacts/build-info.txt artifacts/Image.gz-dtb \
            --title "OnePlus 6/6T ReSukiSU + SUSFS $(date +%Y-%m-%d)" \
            --notes "$notes"
          echo "Created release: $tag"

      - name: Save compiler cache
        if: success() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ needs.resolve-inputs.outputs.build_key }}

      - name: Save unchanged-input marker
        if: success() && needs.resolve-inputs.outputs.marker_hit != 'true'
        shell: bash
        run: |
          mkdir -p .build-marker
          printf '%s\n' '${{ needs.resolve-inputs.outputs.build_key }}' > .build-marker/build-key

      - name: Cache unchanged-input marker
        if: success() && needs.resolve-inputs.outputs.marker_hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build-marker
          key: built-v1-${{ needs.resolve-inputs.outputs.build_key }}
