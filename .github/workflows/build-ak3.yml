name: Build OnePlus 6/6T Lineage 4.9 AK3

on:
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: BakaSU branch, tag, or commit
        required: false
        default: main
        type: string
      bbg_ref:
        description: Baseband Guard branch, tag, or commit
        required: false
        default: main
        type: string
      kernel_patches_ref:
        description: WildKernels patches branch, tag, or commit
        required: false
        default: main
        type: string
      anykernel_ref:
        description: AnyKernel3 branch, tag, or commit
        required: false
        default: master
        type: string
      rtl8812au_ref:
        description: rtl8812au driver branch, tag, or commit
        required: false
        default: v5.6.4.2
        type: string
      force_rebuild:
        description: Ignore the unchanged-input cache and rebuild
        required: false
        default: false
        type: boolean
      create_release:
        description: Create a GitHub Release with the AK3 zip and checksums
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag (auto-generated as v1.0.0-<timestamp> if empty)
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

concurrency:
  group: oneplus-sdm845-ak3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-inputs:
    runs-on: ubuntu-24.04
    outputs:
      build_key: ${{ steps.meta.outputs.build_key }}
      skip: ${{ steps.decide.outputs.skip }}
      marker_hit: ${{ steps.marker.outputs.cache-hit }}
      bakasu_sha: ${{ steps.meta.outputs.bakasu_sha }}
      cake_sha: ${{ steps.meta.outputs.cake_sha }}
      bbg_sha: ${{ steps.meta.outputs.bbg_sha }}
      kernel_patches_sha: ${{ steps.meta.outputs.kernel_patches_sha }}
      rtl8812au_sha: ${{ steps.meta.outputs.rtl8812au_sha }}
      anykernel_sha: ${{ steps.meta.outputs.anykernel_sha }}
    env:
      CONFIG: configs/enchilada.json
      BAKASU_REF: ${{ inputs.bakasu_ref || '' }}
      BBG_REF: ${{ inputs.bbg_ref || 'main' }}
      KERNEL_PATCHES_REF: ${{ inputs.kernel_patches_ref || 'main' }}
      RTL8812AU_REF: ${{ inputs.rtl8812au_ref || 'v5.6.4.2' }}
      ANYKERNEL_REF: ${{ inputs.anykernel_ref || 'master' }}
    steps:
      - name: Checkout builder metadata
        uses: actions/checkout@v5

      - name: Resolve upstream commits
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local repo=$1 ref=$2 sha
            if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf '%s\n' "$ref"
              return
            fi
            sha=$(git ls-remote "$repo" \
              "refs/heads/$ref" "refs/tags/$ref" "refs/tags/$ref^{}" |
              awk '$2 ~ /\^\{\}$/ { print $1; found=1; exit } \
                   $2 ~ /refs\/(heads|tags)\// && !found { print $1; exit }')
            [[ -n "$sha" ]] || {
              echo "::error::Unable to resolve $repo ref $ref"
              exit 1
            }
            printf '%s\n' "$sha"
          }

          kernel_base=$(jq -r .kernel_base "$CONFIG")
          bakasu_sha=$(resolve_ref "$(jq -r .bakasu_repo "$CONFIG")" "${BAKASU_REF:-$(jq -r .bakasu_ref "$CONFIG")}")
          cake_sha=$(resolve_ref "$(jq -r .cake_repo "$CONFIG")" "$(jq -r .cake_ref "$CONFIG")")
          bbg_sha=$(resolve_ref "$(jq -r .bbg_repo "$CONFIG")" "$BBG_REF")
          kernel_patches_sha=$(resolve_ref "$(jq -r .kernel_patches_repo "$CONFIG")" "$KERNEL_PATCHES_REF")
          rtl8812au_sha=$(resolve_ref "$(jq -r .rtl8812au_repo "$CONFIG")" "$RTL8812AU_REF")
          anykernel_sha=$(resolve_ref "$(jq -r .anykernel_repo "$CONFIG")" "$ANYKERNEL_REF")
          builder_sha=$(git rev-parse HEAD)
          patch_sha=$(git ls-files -z -- 'patches/lineage-4.9/*.patch' 'patches/lineage-4.9/droidspaces-backports/*.patch' | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          build_key="${kernel_base}-${bakasu_sha}-${cake_sha}-${bbg_sha}-${kernel_patches_sha}-${rtl8812au_sha}-${anykernel_sha}-${builder_sha}-${patch_sha}"

          {
            echo "bakasu_sha=$bakasu_sha"
            echo "cake_sha=$cake_sha"
            echo "bbg_sha=$bbg_sha"
            echo "kernel_patches_sha=$kernel_patches_sha"
            echo "rtl8812au_sha=$rtl8812au_sha"
            echo "anykernel_sha=$anykernel_sha"
            echo "build_key=$build_key"
          } >> "$GITHUB_OUTPUT"

      - name: Check unchanged-input marker
        id: marker
        uses: actions/cache/restore@v5
        with:
          path: .build-marker
          key: built-v1-${{ steps.meta.outputs.build_key }}
          lookup-only: true

      - name: Decide whether to build
        id: decide
        env:
          CACHE_HIT: ${{ steps.marker.outputs.cache-hit }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        shell: bash
        run: |
          if [[ "$CACHE_HIT" == "true" && "$FORCE_REBUILD" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Inputs unchanged; skipping kernel build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Build required (cache_hit=$CACHE_HIT force_rebuild=$FORCE_REBUILD)."
          fi

  build:
    needs: resolve-inputs
    if: needs.resolve-inputs.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONFIG: configs/enchilada.json
      BAKASU_REF: ${{ needs.resolve-inputs.outputs.bakasu_sha }}
      CAKE_REF: ${{ needs.resolve-inputs.outputs.cake_sha }}
      BBG_REF: ${{ needs.resolve-inputs.outputs.bbg_sha }}
      KERNEL_PATCHES_REF: ${{ needs.resolve-inputs.outputs.kernel_patches_sha }}
      RTL8812AU_REF: ${{ needs.resolve-inputs.outputs.rtl8812au_sha }}
      ANYKERNEL_REF: ${{ needs.resolve-inputs.outputs.anykernel_sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Read configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          jq -e . "$CONFIG" >/dev/null
          for key in kernel_repo kernel_ref kernel_base defconfig arch cross_compile \
                     bakasu_repo cake_repo bbg_repo \
                     kernel_patches_repo rtl8812au_repo anykernel_repo; do
            echo "$key=$(jq -r .$key "$CONFIG")" >> "$GITHUB_OUTPUT"
          done

      - name: Install build dependencies
        run: |
          # Prefer the public Ubuntu archive over the slow Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            bc bison build-essential cpio flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev-arm64-cross libc6-dev-armhf-cross ccache git libelf-dev libssl-dev python3 \
            qemu-user qemu-system-arm e2fsprogs rsync unzip zip

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ needs.resolve-inputs.outputs.build_key }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Clone pinned kernel base
        run: |
          git clone --filter=blob:none --no-checkout \
            '${{ steps.config.outputs.kernel_repo }}' kernel
          git -C kernel fetch --depth=1 origin \
            '${{ steps.config.outputs.kernel_base }}'
          git -C kernel checkout --detach \
            '${{ steps.config.outputs.kernel_base }}'
          test "$(git -C kernel rev-parse HEAD)" = \
            '${{ steps.config.outputs.kernel_base }}'

      - name: Apply 4.9 adaptation and fetch latest upstreams
        run: |
          set -euo pipefail
          git -C kernel apply --whitespace=nowarn \
            "$GITHUB_WORKSPACE/patches/lineage-4.9/kernel-4.9-adaptation.patch"
          scripts/prepare-sources.sh kernel \
            '${{ steps.config.outputs.bakasu_repo }}' "$BAKASU_REF" \
            "$GITHUB_WORKSPACE/patches/lineage-4.9" \
            '${{ steps.config.outputs.cake_repo }}' "$CAKE_REF" "$RUNNER_TEMP/sch_cake" \
            '${{ steps.config.outputs.bbg_repo }}' "$BBG_REF" \
            '${{ steps.config.outputs.kernel_patches_repo }}' "$KERNEL_PATCHES_REF" \
            "$RUNNER_TEMP/kernel_patches" \
            '${{ steps.config.outputs.rtl8812au_repo }}' "$RTL8812AU_REF" \
            "$RUNNER_TEMP/rtl8812au"

      - name: Fetch latest AnyKernel3
        run: |
          git clone --filter=blob:none --no-checkout \
            '${{ steps.config.outputs.anykernel_repo }}' anykernel3
          git -C anykernel3 fetch --depth=1 origin "$ANYKERNEL_REF"
          git -C anykernel3 checkout --detach FETCH_HEAD

      - name: Configure kernel
        working-directory: kernel
        run: |
          make O=out ARCH='${{ steps.config.outputs.arch }}' \
            '${{ steps.config.outputs.defconfig }}'
          bash scripts/kconfig/merge_config.sh -m -O out out/.config \
            "$GITHUB_WORKSPACE/configs/mihomo-ebpf-4.9.fragment"
          make O=out ARCH='${{ steps.config.outputs.arch }}' olddefconfig
          grep -qx 'CONFIG_BPF_JIT=y' out/.config
          grep -qx 'CONFIG_BPF_UNPRIV_DEFAULT_OFF=y' out/.config
          grep -qx 'CONFIG_SCHED_WALT=y' out/.config
          grep -E '^CONFIG_KSU(|_SUSFS.*)=y$' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' out/.config
          grep -qx 'CONFIG_HYBRIDMOUNT=y' out/.config
          grep -qx 'CONFIG_KEYS=y' out/.config
          if grep -Eq '^CONFIG_NOMOUNT=[ym]$' out/.config; then
            echo '::error::NoMount must not coexist with Hybrid Mount VFS'
            exit 1
          fi
          grep -qx 'CONFIG_MAC80211=y' out/.config
          grep -qx 'CONFIG_ATH9K_HTC=y' out/.config
          grep -qx 'CONFIG_RT2800USB=y' out/.config
          grep -qx 'CONFIG_MT7601U=y' out/.config
          grep -q '^CONFIG_EXTRA_FIRMWARE="htc_9271.fw rt2870.bin mt7601u.bin"$' out/.config
          # KPatch-Next / KPM requirement (kernel image static patching)
          grep -qx 'CONFIG_KALLSYMS=y' out/.config
          grep -qx 'CONFIG_KALLSYMS_ALL=y' out/.config
          # ReKernel-X
          grep -qx 'CONFIG_REKERNEL=y' out/.config
          grep -qx 'CONFIG_REKERNEL_NETWORK=y' out/.config
          # zram compression backends and their built-in dependencies
          for option in CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_SWAP \
            CONFIG_CRYPTO_LZ4 CONFIG_LZ4_COMPRESS CONFIG_LZ4_DECOMPRESS \
            CONFIG_CRYPTO_ZSTD CONFIG_ZSTD_COMPRESS CONFIG_ZSTD_DECOMPRESS; do
            grep -qx "${option}=y" out/.config
          done
          # PSI is active by default, without requiring psi=1 at boot
          grep -qx 'CONFIG_PSI=y' out/.config
          grep -qx '# CONFIG_PSI_DEFAULT_DISABLED is not set' out/.config
          # rtl8812au/8821au/8814au out-of-tree USB Wi-Fi
          grep -qx 'CONFIG_88XXAU=y' out/.config
          required=(
            CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_NAMESPACES CONFIG_UTS_NS
            CONFIG_IPC_NS CONFIG_PID_NS CONFIG_USER_NS CONFIG_NET_NS
            CONFIG_SECCOMP CONFIG_SECCOMP_FILTER CONFIG_CGROUPS
            CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS CONFIG_MEMCG
            CONFIG_CGROUP_SCHED CONFIG_CGROUP_FREEZER CONFIG_CGROUP_NET_PRIO
            CONFIG_DEVTMPFS CONFIG_OVERLAY_FS CONFIG_TMPFS_POSIX_ACL
            CONFIG_TMPFS_XATTR CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER
            CONFIG_NETFILTER CONFIG_NF_CONNTRACK CONFIG_NF_TABLES
            CONFIG_IP_NF_TARGET_MASQUERADE CONFIG_IP_ADVANCED_ROUTER
            CONFIG_IP_MULTIPLE_TABLES
            CONFIG_NET_SCH_CAKE CONFIG_TCP_CONG_BBR3 CONFIG_BBG
          )
          for option in "${required[@]}"; do
            grep -qx "${option}=y" out/.config || {
              echo "::error::Missing Droidspaces requirement: ${option}=y"
              exit 1
            }
          done
          grep -qx '# CONFIG_ANDROID_PARANOID_NETWORK is not set' out/.config
          "$GITHUB_WORKSPACE/scripts/check-susfs-4.9.sh" . --config out/.config
          python3 "$GITHUB_WORKSPACE/scripts/check-droidspaces-config.py" . \
            --config out/.config > "$GITHUB_WORKSPACE/droidspaces-config-check.json"
          cat "$GITHUB_WORKSPACE/droidspaces-config-check.json"

      - name: Test BakaSU ABI compatibility and SELinux hook failure handling
        run: |
          set -euo pipefail
          mkdir -p artifacts/bakasu-tests
          python3 tests/host/test-source-revisions.py | tee artifacts/bakasu-tests/source-revisions.log
          python3 tests/host/test-bakasu-compat.py | tee artifacts/bakasu-tests/abi.log
          python3 tests/host/test-selinux-cleanup.py | tee artifacts/bakasu-tests/selinux-cleanup.log
          python3 tests/host/test-bakasu-integration.py | tee artifacts/bakasu-tests/integration.log

      - name: Test kernel-only boot image installation
        run: python3 tests/host/test-ak3-ramdisk.py --anykernel anykernel3

      - name: Test SUSFS priority filter and Hybrid Mount source regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/component-tests
          python3 tests/host/test-susfs-priority.py --source kernel \
            | tee artifacts/component-tests/susfs-priority.log
          python3 tests/host/run-hybridmount-tests.py --source kernel \
            | tee artifacts/component-tests/hybridmount.log

      - name: Build pinned upstream cgroup freezer self-tests
        run: |
          set -euo pipefail
          freezer_repo=$(jq -r .repository configs/freezer-test.json)
          freezer_version=$(jq -r .version configs/freezer-test.json)
          git clone --bare --filter=blob:none --depth=1 --branch "v${freezer_version}" \
            "$freezer_repo" "$RUNNER_TEMP/freezer-upstream.git"
          bash tests/host/build-freezer-tests.sh \
            "$RUNNER_TEMP/freezer-upstream.git" artifacts/freezer-tests

      - name: Build Binder freezer transaction tests
        run: bash tests/host/build-binder-freezer-tests.sh kernel artifacts/binder-freezer-tests

      - name: Build Droidspaces systemd syscall tests
        run: bash tests/host/build-droidspaces-tests.sh kernel artifacts/droidspaces-tests

      - name: Build Hybrid Mount and CAKE runtime tests
        run: bash tests/host/build-component-tests.sh kernel artifacts/component-tests

      - name: Install target UAPI headers for BakaSU preinit
        working-directory: kernel
        run: |
          make O=out ARCH='${{ steps.config.outputs.arch }}' \
            headers_install INSTALL_HDR_PATH="$GITHUB_WORKSPACE/kernel/out/usr"

      - name: Build Image.gz-dtb
        working-directory: kernel
        run: |
          make O=out ARCH='${{ steps.config.outputs.arch }}' \
            CROSS_COMPILE="ccache ${{ steps.config.outputs.cross_compile }}" \
            KCFLAGS=-Wno-error -j"$(nproc)" Image.gz-dtb
          ccache --show-stats

      - name: Verify BakaSU hooks and embedded preinit ELF
        run: |
          set -euo pipefail
          python3 tests/host/check-bakasu-image.py \
            --source kernel \
            --vmlinux kernel/out/vmlinux \
            --runner kernel/out/drivers/kernelsu/preinit/runner.elf \
            | tee artifacts/bakasu-tests/image.log
          cp kernel/out/drivers/kernelsu/preinit/runner.elf artifacts/bakasu-tests/

      - name: Set up Go for real Mihomo BPF regression tests
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: tests/device/ebpf-backport/go.sum

      - name: Build pinned Mihomo integration tests
        run: |
          set -euo pipefail
          mihomo_repo=$(jq -r .repository configs/mihomo-ebpf-test.json)
          mihomo_commit=$(jq -r .commit configs/mihomo-ebpf-test.json)
          git init -q "$RUNNER_TEMP/mihomo-ebpf"
          git -C "$RUNNER_TEMP/mihomo-ebpf" fetch --depth=1 "$mihomo_repo" "$mihomo_commit"
          git -C "$RUNNER_TEMP/mihomo-ebpf" checkout --detach FETCH_HEAD
          bash tests/host/build-ebpf-tests.sh "$RUNNER_TEMP/mihomo-ebpf" artifacts/ebpf-tests

      - name: Boot 4.9 ARM64 and test Mihomo packet-rewrite, cgroup and TC
        run: |
          set -euo pipefail
          mkdir -p kernel/out-bpf-qemu
          cp tests/host/bpf-qemu.config kernel/out-bpf-qemu/.config
          make -C kernel O=out-bpf-qemu ARCH=arm64 olddefconfig
          make -C kernel O=out-bpf-qemu ARCH=arm64 \
            CROSS_COMPILE="ccache aarch64-linux-gnu-" \
            KCFLAGS=-Wno-error -j"$(nproc)" Image
          python3 tests/host/run-ebpf-qemu.py \
            --kernel kernel/out-bpf-qemu/arch/arm64/boot/Image \
            --busybox anykernel3/tools/busybox \
            --mihomo-test artifacts/ebpf-tests/mihomo-ebpf.test \
            --inbound-test artifacts/ebpf-tests/mihomo-ebpf-inbound.test \
            --probe artifacts/ebpf-tests/ebpf-backport.test \
            --log artifacts/ebpf-tests/qemu.log

      - name: Execute the production BakaSU preinit ELF on Linux 4.9
        run: |
          python3 tests/host/run-bakasu-preinit-qemu.py \
            --kernel kernel/out-bpf-qemu/arch/arm64/boot/Image \
            --runner artifacts/bakasu-tests/runner.elf \
            --busybox anykernel3/tools/busybox \
            --control artifacts/freezer-tests/freezer-backport.test \
            --log artifacts/bakasu-tests/preinit-qemu.log

      - name: Test Droidspaces backports on ARM64 and ARM32
        run: |
          python3 tests/host/run-droidspaces-qemu.py \
            --kernel kernel/out-bpf-qemu/arch/arm64/boot/Image \
            --busybox anykernel3/tools/busybox \
            --test artifacts/droidspaces-tests/droidspaces-arm64.test \
            --compat-test artifacts/droidspaces-tests/droidspaces-arm32.test \
            --control artifacts/freezer-tests/freezer-backport.test \
            --log artifacts/droidspaces-tests/qemu.log

      - name: Upload Droidspaces syscall results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: droidspaces-backport-tests
          path: artifacts/droidspaces-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test Hybrid Mount ext4 inode handling, CAKE and memcg swap
        run: |
          python3 tests/host/run-components-qemu.py \
            --kernel kernel/out-bpf-qemu/arch/arm64/boot/Image \
            --busybox anykernel3/tools/busybox \
            --test artifacts/component-tests/components-runtime.test \
            --control artifacts/freezer-tests/freezer-backport.test \
            --log artifacts/component-tests/qemu.log

      - name: Upload BakaSU execution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bakasu-runtime-tests
          path: artifacts/bakasu-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload component regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-tests
          path: artifacts/component-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test cgroup v2 freezing, signals, migration and v1 coexistence
        run: |
          python3 tests/host/run-freezer-qemu.py \
            --kernel kernel/out-bpf-qemu/arch/arm64/boot/Image \
            --busybox anykernel3/tools/busybox \
            --upstream-test artifacts/freezer-tests/test_freezer \
            --backport-test artifacts/freezer-tests/freezer-backport.test \
            --log artifacts/freezer-tests/qemu.log

      - name: Test Binder freezing with real cross-process transactions
        run: |
          python3 tests/host/run-binder-freezer-qemu.py \
            --kernel kernel/out-bpf-qemu/arch/arm64/boot/Image \
            --busybox anykernel3/tools/busybox \
            --test artifacts/binder-freezer-tests/binder-freezer.test \
            --compat-test artifacts/binder-freezer-tests/binder-freezer-arm32.test \
            --log artifacts/binder-freezer-tests/qemu.log

      - name: Upload Binder freezer execution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: binder-freezer-runtime-tests
          path: artifacts/binder-freezer-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload cgroup freezer execution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freezer-runtime-tests
          path: artifacts/freezer-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload BPF execution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-runtime-tests
          path: artifacts/ebpf-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build device syscall regression test
        run: |
          set -euo pipefail
          mkdir -p artifacts/device-tests
          aarch64-linux-gnu-gcc -static -O2 -Wall -Wextra \
            -o artifacts/device-tests/susfs_syscall_test \
            tests/device/susfs_syscall_test.c
          aarch64-linux-gnu-gcc -static -O2 -Wall -Wextra \
            -o artifacts/device-tests/selinux_hide_test \
            tests/device/selinux_hide_test.c
          cp tests/device/run-susfs-regression.sh tests/device/README.md \
            tests/device/compare-selinux-results.py tests/device/run-droidspaces-check.sh \
            artifacts/device-tests/
          cp droidspaces-config-check.json artifacts/
          chmod 0755 artifacts/device-tests/run-susfs-regression.sh \
            artifacts/device-tests/run-droidspaces-check.sh

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/source_revisions.py kernel --check
          cp "$(git -C kernel rev-parse --absolute-git-dir)/source-revisions.json" artifacts/
          bakasu_sha=$(git -C kernel/KernelSU rev-parse --short=8 HEAD)
          susfs_sha=$(sha256sum patches/lineage-4.9/susfs-4.9.patch | cut -c1-8)
          droidspaces_sha=$(sha256sum patches/lineage-4.9/droidspaces-4.9.patch | cut -c1-8)
          systemd_sha=$(sha256sum patches/lineage-4.9/droidspaces-backports/*.patch | sha256sum | cut -c1-8)
          package="OnePlus6-6T-BakaSU-${bakasu_sha}-SUSFS-${susfs_sha}-DS7-${droidspaces_sha}-AK3.zip"
          package="${package%-AK3.zip}-TC-eBPF-FreezerV2-Binder-experimental-AK3.zip"
          package="${package%-AK3.zip}-systemd262-${systemd_sha}-AK3.zip"
          scripts/package-ak3.sh anykernel3 \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            ak3/anykernel.sh "artifacts/$package"
          (cd artifacts && sha256sum "$package" > SHA256SUMS)
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifacts/
          cp configs/droidspaces-backports.json artifacts/
          {
            echo "builder=$(git rev-parse HEAD)"
            echo "kernel=$(git -C kernel rev-parse HEAD)"
            echo "kernel_upstream=$(python3 scripts/source_revisions.py kernel --upstream)"
            echo "bakasu_repo=${{ steps.config.outputs.bakasu_repo }}"
            echo "bakasu=$(git -C kernel/KernelSU rev-parse HEAD)"
            echo "bakasu_upstream=$(python3 scripts/source_revisions.py kernel/KernelSU --upstream)"
            echo "source_revisions=source-revisions.json"
            echo "source_status=committed-adaptations-clean"
            echo "bakasu_reviewed_commit=$(jq -r .susfs.bakasu_reviewed_commit configs/vendored-upstreams.json)"
            echo "bakasu_compat_patch=$(sha256sum patches/lineage-4.9/bakasu-compat-4.9.patch | cut -c1-12)"
            echo "bakasu_preinit_hooks=$(sha256sum patches/lineage-4.9/bakasu-preinit-module-4.9.patch | cut -c1-12)"
            echo "bakasu_preinit=embedded-static-elf-and-susfs-inline-hooks"
            echo "ak3_installer=$(sha256sum ak3/anykernel.sh | cut -c1-12)"
            echo "boot_installation=kernel-only-preserve-ramdisk"
            echo "ebpf_scope=experimental-packet-rewrite-cgroup-and-isolated-tc-direct-lookup"
            echo "ebpf_patch=$(sha256sum patches/lineage-4.9/mihomo-ebpf-4.9.patch | cut -c1-12)"
            echo "ebpf_cgroup_patch=$(sha256sum patches/lineage-4.9/mihomo-cgroup-4.9.patch | cut -c1-12)"
            echo "ebpf_tc_patch=$(sha256sum patches/lineage-4.9/mihomo-tc-4.9.patch | cut -c1-12)"
            echo "freezer_scope=experimental-cgroup-v2"
            echo "freezer_patch=$(sha256sum patches/lineage-4.9/cgroup-v2-freezer-4.9.patch | cut -c1-12)"
            echo "freezer_source=linux-$(jq -r .version configs/freezer-test.json)@$(jq -r .commit configs/freezer-test.json)"
            echo "binder_freezer_ioctl=BINDER_FREEZE,BINDER_GET_FROZEN_INFO"
            echo "binder_freezer_patch=$(sha256sum patches/lineage-4.9/binder-freezer-4.9.patch | cut -c1-12)"
            echo "binder_freezer_source=$(jq -r .commit configs/binder-freezer.json)"
            echo "binder_freeze_notifications=not-backported"
            echo "susfs=v2.3.0-vendored ($(sha256sum patches/lineage-4.9/susfs-4.9.patch | cut -c1-12))"
            echo "hybridmount=$(jq -r .hybridmount.version configs/vendored-upstreams.json)@$(jq -r .hybridmount.commit configs/vendored-upstreams.json) ($(sha256sum patches/lineage-4.9/hybridmount-4.9.patch | cut -c1-12))"
            echo "susfs_upstream=$(jq -r .susfs.commit configs/vendored-upstreams.json)"
            echo "susfs_port=$(jq -r .susfs.port_commit configs/vendored-upstreams.json)"
            echo "susfs_core=$(jq -r .susfs.core_commit configs/vendored-upstreams.json)"
            echo "bakasu_susfs_sync_patch=$(sha256sum patches/lineage-4.9/bakasu-susfs-sync-4.9.patch | cut -c1-12)"
            echo "rekernel_integration=$(jq -r .rekernel.commit configs/vendored-upstreams.json)"
            echo "bakasu_selinux_patch=$(sha256sum patches/lineage-4.9/bakasu-selinux-4.9.patch | cut -c1-12)"
            echo "selinux_integration=$(jq -r .susfs.selinux_integration configs/vendored-upstreams.json)"
            echo "selinux_runtime=not-tested-by-ci"
            echo "droidspaces=$(jq -r .version configs/droidspaces.json)@$(jq -r .commit configs/droidspaces.json)"
            echo "droidspaces_patch=$(sha256sum patches/lineage-4.9/droidspaces-4.9.patch | cut -c1-12)"
            echo "droidspaces_cpu_quota_policy=$(jq -r .cpu_quota_policy configs/droidspaces.json)"
            echo "droidspaces_swap_accounting=enabled-by-default"
            echo "droidspaces_backports=$(jq -r .commit configs/droidspaces-backports.json)"
            echo "droidspaces_backports_patchset=$systemd_sha"
            echo "droidspaces_runtime_required=$(jq -r .runtime.required_commit configs/droidspaces-backports.json)"
            echo "systemd_backports_scope=258-262-interfaces; container-boot-not-tested-by-ci"
            echo "cake=$(git -C "$RUNNER_TEMP/sch_cake" rev-parse HEAD)"
            echo "baseband_guard=$(git -C kernel/Baseband-guard rev-parse HEAD)"
            echo "baseband_guard_upstream=$(python3 scripts/source_revisions.py kernel/Baseband-guard --upstream)"
            echo "kernel_patches=$(git -C "$RUNNER_TEMP/kernel_patches" rev-parse HEAD)"
            echo "rtl8812au=$(git -C "$RUNNER_TEMP/rtl8812au" rev-parse HEAD)"
            echo "anykernel3=$(git -C anykernel3 rev-parse HEAD)"
            echo "firmware_sha256=$(sha256sum kernel/firmware/htc_9271.fw kernel/firmware/rt2870.bin kernel/firmware/mt7601u.bin | tr '\n' ';')"
          } > artifacts/build-info.txt

      - name: Upload AK3 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OnePlus6-6T-lineage-4.9-ak3
          path: |
            artifacts/
            !artifacts/ebpf-tests/**
            !artifacts/droidspaces-tests/**
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="v1.0.0-$(date +%Y%m%d-%H%M%S)"
          fi

          notes="## 构建信息

          $(awk -F= '{printf "- **%s**: \`%s\`\n", $1, $2}' artifacts/build-info.txt)

          ## 使用

          1. 解压 action artifact 后，核对 \`SHA256SUMS\` 再刷入 \`*-AK3.zip\`；
          2. 本 release 的资产即 artifact 内对应文件，校验值见 \`SHA256SUMS\`。"

          gh release create "$tag" \
            artifacts/*-AK3.zip artifacts/SHA256SUMS \
            artifacts/build-info.txt artifacts/source-revisions.json artifacts/Image.gz-dtb \
            --title "OnePlus 6/6T BakaSU + SUSFS $(date +%Y-%m-%d)" \
            --notes "$notes"
          echo "Created release: $tag"

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ needs.resolve-inputs.outputs.build_key }}

      - name: Save unchanged-input marker
        if: success() && needs.resolve-inputs.outputs.marker_hit != 'true'
        shell: bash
        run: |
          mkdir -p .build-marker
          printf '%s\n' '${{ needs.resolve-inputs.outputs.build_key }}' > .build-marker/build-key

      - name: Cache unchanged-input marker
        if: success() && needs.resolve-inputs.outputs.marker_hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build-marker
          key: built-v1-${{ needs.resolve-inputs.outputs.build_key }}
